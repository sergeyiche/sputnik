# Ассистент Спутник. Файл кладётся в /etc/nginx/vhosts/spootnik/.
# ISPmanager его не создаёт. Сайт fondparkinson.ru этим файлом не затрагивается:
# другое имя server_name, другие сертификаты, без include vhosts-includes.
#
# Контейнер виджета слушает только 127.0.0.1:8088.
# Сейчас сертификат самоподписанный: у spootnik.online нет A-записи на этот сервер,
# Let's Encrypt выпустить нельзя. Когда запись укажет на 141.133.189.73,
# замените сертификат, не меняя server_name и proxy_pass.

server {
	listen 141.133.189.73:80;
	server_name spootnik.online www.spootnik.online *.spootnik.online;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		default_type text/plain;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 141.133.189.73:443 ssl;
	server_name spootnik.online www.spootnik.online *.spootnik.online;

	ssl_certificate /etc/nginx/ssl/spootnik.online/fullchain.pem;
	ssl_certificate_key /etc/nginx/ssl/spootnik.online/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers on;

	client_max_body_size 60m;

	access_log /var/log/nginx/spootnik.online.access.log;
	error_log /var/log/nginx/spootnik.online.error.log notice;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		default_type text/plain;
	}

	location / {
		proxy_pass http://127.0.0.1:8088;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
		proxy_request_buffering off;
	}
}
