# Docker DNS. Имя api резолвится на каждый запрос: после пересоздания
# контейнера API nginx не остаётся на старом адресе.

map $http_host $operator_console {
    default $scheme://spootnik.local/console/;
    ~*^admin\.(.+)$ $scheme://$1/console/;
}

server {
    listen 80;
    server_name spootnik.ru www.spootnik.ru spootnik.local www.spootnik.local;
    root /usr/share/nginx/html/landing;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /v1/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        return 404;
    }

    location = /console {
        return 302 /console/;
    }

    location /console/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /console/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Старый адрес консоли: на корень домена /console, порт из Host сохраняется.
server {
    listen 80;
    server_name admin.spootnik.ru admin.spootnik.local;
    return 302 $operator_console;
}

# Кабинет организации help и файлы виджета для лэндинга.
server {
    listen 80;
    server_name help.spootnik.ru help.spootnik.local;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        return 302 /admin/;
    }

    location /widget/ {
        alias /usr/share/nginx/html/widget/;
        add_header Cache-Control "no-cache";
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
    }

    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /v1/admin/ {
        client_max_body_size 60m;
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    location /v1/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /widget/ {
        alias /usr/share/nginx/html/widget/;
        add_header Cache-Control "no-cache";
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
    }

    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Admin API: file uploads (ADMIN_MAX_UPLOAD_MB=50 + multipart overhead) and slow conversions
    location /v1/admin/ {
        client_max_body_size 60m;
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    location /v1/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $http_host;
    }
}
